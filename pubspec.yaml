name: herbalwisdom
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+30

environment:
  sdk: ^3.7.2



dependencies:
  flutter:
    sdk: flutter

  
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  url_launcher: ^6.3.0
  pinput:
  shared_preferences: ^2.5.3
  smooth_page_indicator: ^1.2.1
  carousel_slider: ^5.1.1
  flutter_local_notifications: ^19.5.0
  open_filex: ^4.7.0
  file_picker: ^10.3.6
  path_provider: ^2.1.5
  image_picker: ^1.2.1
  shimmer: ^3.0.0
  html: ^0.15.6

# firebase packages
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore:
  firebase_messaging: ^16.0.4
  firebase_storage: ^13.0.4
  firebase_app_installations: ^0.4.0+4
  country_code_picker:
  app_badge_plus:
  intl:

dev_dependencies:
  flutter_test:
    sdk: flutter

  
  flutter_lints: ^5.0.0
  rename: ^3.1.0
  flutter_launcher_icons: ^0.14.4
 
flutter:

  uses-material-design: true

  
  assets:
    - assets/icons/
# 👇 LAUNCHER ICON CONFIG
flutter_launcher_icons:
  android: true
  ios: true

  # main square icon (use the spiral-only version here)
  image_path: "assets/icons/herbal_logo.png"

  # For Android adaptive icon (uses transparent version on top)
  adaptive_icon_foreground: "assets/icons/herbal_logo_transparent.png"
  adaptive_icon_background: "#FFFFFFFF"
  
